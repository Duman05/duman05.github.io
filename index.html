<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duman İzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0b0b0f;color:white;padding-bottom:80px}
header{background:#111827;padding:20px;text-align:center}
header h1{color:#facc15}
.search{text-align:center;padding:20px}
.search input{width:90%;max-width:500px;padding:14px;border-radius:25px;border:none;background:#1f2937;color:white}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px;padding:20px}
.card{background:#1f2937;border-radius:18px;overflow:hidden;cursor:pointer;transition:.3s}
.card:hover{transform:scale(1.04)}
.poster{height:230px;background:linear-gradient(135deg,#facc15,#7c2d12);display:flex;align-items:center;justify-content:center;font-size:60px}
.info{padding:15px}
.info h3{margin-bottom:8px}
.info p{color:#aaa;font-size:14px}
.playerBox{display:none;padding:20px}
video{width:100%;max-height:420px;background:#000;border-radius:15px}
.episodes button,.admin button{margin:6px;padding:10px 15px;border:none;border-radius:20px;background:#facc15;font-weight:bold}
.admin{background:#111827;margin:20px;padding:20px;border-radius:18px}
input{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px}
</style>
</head>
<body>

<header>
  <h1>Duman İzle</h1>
  <p>Dizi ve bölüm arşivi</p>
</header>

<div class="search">
  <input type="text" id="search" placeholder="Dizi ara..." onkeyup="searchSeries()">
</div>

<div class="grid" id="seriesList"></div>

<div class="playerBox" id="playerBox">
  <h2 id="watchTitle"></h2><br>
  <video id="videoPlayer" controls></video>
  <div class="episodes" id="episodes"></div>
</div>

<div class="admin">
  <h2>Admin Panel</h2>
  <input type="password" id="pass" placeholder="Admin şifresi">
  <button onclick="login()">Giriş</button>

  <div id="adminArea" style="display:none">
    <input type="text" id="seriesName" placeholder="Dizi adı">
    <input type="text" id="episodeName" placeholder="Bölüm adı">
    <input type="text" id="videoUrl" placeholder="Video linki örnek: videolar/bolum1.mp4">
    <button onclick="addEpisode()">Bölüm Ekle</button>
  </div>
</div>

<script>
const ADMIN_PASSWORD = "12345";

let series = [
  {
    name:"Kurtlar Vadisi",
    desc:"Aksiyon ve dram",
    icon:"🎬",
    episodes:[
      {name:"1. Bölüm", url:"videolar/bolum1.mp4"}
    ]
  },
  {
    name:"Efsane Dizi",
    desc:"Macera",
    icon:"🔥",
    episodes:[
      {name:"1. Bölüm", url:"videolar/efsane1.mp4"}
    ]
  }
];

function render(){
  const list=document.getElementById("seriesList");
  list.innerHTML="";
  series.forEach((s,i)=>{
    list.innerHTML+=`
      <div class="card" onclick="openSeries(${i})" data-name="${s.name.toLowerCase()}">
        <div class="poster">${s.icon}</div>
        <div class="info">
          <h3>${s.name}</h3>
          <p>${s.desc}</p>
        </div>
      </div>
    `;
  });
}

function openSeries(i){
  const box=document.getElementById("playerBox");
  const title=document.getElementById("watchTitle");
  const episodes=document.getElementById("episodes");

  box.style.display="block";
  title.innerText=series[i].name;
  episodes.innerHTML="";

  series[i].episodes.forEach((ep)=>{
    episodes.innerHTML+=`
      <button onclick="playVideo('${ep.url}','${series[i].name} - ${ep.name}')">
        ${ep.name}
      </button>
    `;
  });

  window.scrollTo(0,box.offsetTop);
}

function playVideo(url,title){
  const player=document.getElementById("videoPlayer");
  document.getElementById("watchTitle").innerText=title;
  player.src=url;
  player.play();
}

function searchSeries(){
  const q=document.getElementById("search").value.toLowerCase();
  document.querySelectorAll(".card").forEach(card=>{
    card.style.display=card.dataset.name.includes(q) ? "block" : "none";
  });
}

function login(){
  if(document.getElementById("pass").value===ADMIN_PASSWORD){
    document.getElementById("adminArea").style.display="block";
  }else{
    alert("Şifre yanlış");
  }
}

function addEpisode(){
  const name=document.getElementById("seriesName").value;
  const ep=document.getElementById("episodeName").value;
  const url=document.getElementById("videoUrl").value;

  if(!name || !ep || !url){
    alert("Tüm alanları doldur");
    return;
  }

  let found=series.find(s=>s.name===name);

  if(!found){
    found={name:name,desc:"Yeni içerik",icon:"🎥",episodes:[]};
    series.push(found);
  }

  found.episodes.push({name:ep,url:url});
  render();
  alert("Bölüm eklendi");
}

render();
</script>

</body>
</html>
