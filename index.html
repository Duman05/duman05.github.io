<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duman Music Admin</title>
<style>
body{margin:0;background:#111;color:white;font-family:Arial;padding-bottom:120px}
header{text-align:center;padding:25px;background:#181818}
h1{color:#00ff99}
.box{max-width:400px;margin:25px auto;background:#222;padding:20px;border-radius:18px;text-align:center}
input{width:90%;padding:12px;margin:8px;border-radius:10px;border:none}
button{background:#00ff99;border:none;padding:12px 20px;border-radius:20px;font-weight:bold;cursor:pointer}
.song{background:#1b1b1b;margin:12px;padding:15px;border-radius:12px}
.player{position:fixed;bottom:0;left:0;right:0;background:#000;padding:15px;text-align:center}
audio{width:95%;max-width:600px}
</style>
</head>
<body>

<header>
  <h1>🎵 Duman Music</h1>
  <p>Admin şarkı yükleme paneli</p>
</header>

<div class="box" id="loginBox">
  <h2>Admin Giriş</h2>
  <input type="password" id="password" placeholder="Admin şifresi">
  <button onclick="login()">Giriş Yap</button>
</div>

<div class="box" id="adminBox" style="display:none">
  <h2>Şarkı Yükle</h2>
  <input type="text" id="songName" placeholder="Şarkı adı">
  <input type="file" id="songFile" accept="audio/*">
  <button onclick="addSong()">Yükle</button>
</div>

<div class="box">
  <h2>Şarkılar</h2>
  <div id="songList">Henüz şarkı yok</div>
</div>

<div class="player">
  <div id="nowPlaying">Henüz şarkı çalmıyor</div>
  <audio id="player" controls></audio>
</div>

<script>
const ADMIN_PASSWORD = "12345"; // Şifreyi buradan değiştir

let songs = [];

function login(){
  const pass = document.getElementById("password").value;

  if(pass === ADMIN_PASSWORD){
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminBox").style.display = "block";
  }else{
    alert("Şifre yanlış!");
  }
}

function addSong(){
  const name = document.getElementById("songName").value;
  const file = document.getElementById("songFile").files[0];

  if(!name || !file){
    alert("Şarkı adı ve dosya seç!");
    return;
  }

  const url = URL.createObjectURL(file);

  songs.push({
    name:name,
    url:url
  });

  showSongs();
}

function showSongs(){
  const list = document.getElementById("songList");
  list.innerHTML = "";

  songs.forEach((song,index)=>{
    list.innerHTML += `
      <div class="song">
        <h3>${song.name}</h3>
        <button onclick="playSong(${index})">▶ Oynat</button>
      </div>
    `;
  });
}

function playSong(index){
  const player = document.getElementById("player");
  const song = songs[index];

  player.src = song.url;
  player.play();

  document.getElementById("nowPlaying").innerText =
  "🎵 Çalıyor: " + song.name;
}
</script>

</body>
</html>
