<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duman Music</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#090909,#1b0033);color:white;padding-bottom:110px}
header{padding:25px;text-align:center;background:#111}
.logo{font-size:32px;font-weight:bold;color:#00ff99}
header p{color:#aaa;margin-top:8px}
.search{padding:20px;text-align:center}
.search input{width:90%;max-width:500px;padding:15px;border:none;border-radius:30px;background:#222;color:white}
.grid{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px;text-align:center;backdrop-filter:blur(8px);transition:.3s}
.card:hover{transform:translateY(-7px);background:rgba(255,255,255,.14)}
.cover{height:150px;border-radius:18px;background:linear-gradient(135deg,#00ff99,#7b2cff);display:flex;align-items:center;justify-content:center;font-size:55px;margin-bottom:15px}
.card h3{font-size:18px;margin-bottom:5px}
.card p{color:#bbb;margin-bottom:15px}
button{background:#00ff99;color:#000;border:none;padding:11px 20px;border-radius:25px;font-weight:bold;cursor:pointer}
button:hover{background:white}
.player{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:1px solid #333;padding:15px;text-align:center}
#nowPlaying{margin-bottom:10px;color:#00ff99;font-weight:bold}
audio{width:90%;max-width:600px}
</style>
</head>
<body>

<header>
  <div class="logo">🎧 Duman Music</div>
  <p>Modern müzik dinleme sitesi</p>
</header>

<div class="search">
  <input type="text" id="searchInput" placeholder="Şarkı ara..." onkeyup="searchSongs()">
</div>

<div class="grid">

  <div class="card" data-name="Gece">
    <div class="cover">🎵</div>
    <h3>Gece</h3>
    <p>Demo Artist</p>
    <button onclick="playSong('sarkilar/gece.mp3','Gece')">Oynat</button>
  </div>

  <div class="card" data-name="Hayal">
    <div class="cover">🎸</div>
    <h3>Hayal</h3>
    <p>Demo Artist</p>
    <button onclick="playSong('sarkilar/hayal.mp3','Hayal')">Oynat</button>
  </div>

  <div class="card" data-name="Ritim">
    <div class="cover">🔥</div>
    <h3>Ritim</h3>
    <p>Demo Artist</p>
    <button onclick="playSong('sarkilar/ritim.mp3','Ritim')">Oynat</button>
  </div>

  <div class="card" data-name="LoFi">
    <div class="cover">🌙</div>
    <h3>Lo-Fi</h3>
    <p>Chill Music</p>
    <button onclick="playSong('sarkilar/lofi.mp3','Lo-Fi')">Oynat</button>
  </div>

</div>

<div class="player">
  <div id="nowPlaying">Henüz şarkı seçilmedi</div>
  <audio id="audioPlayer" controls>
    <source id="audioSource" src="" type="audio/mpeg">
  </audio>
</div>

<script>
function playSong(file, name){
  const player = document.getElementById("audioPlayer");
  const source = document.getElementById("audioSource");

  source.src = file;
  player.load();
  player.play();

  document.getElementById("nowPlaying").innerText = "▶ Çalıyor: " + name;
}

function searchSongs(){
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card=>{
    let name = card.getAttribute("data-name").toLowerCase();
    card.style.display = name.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
