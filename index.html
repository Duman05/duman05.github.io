<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duman Music</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

header{
    background:#1db954;
    padding:20px;
    text-align:center;
}

.song-card{
    max-width:400px;
    margin:40px auto;
    background:#222;
    padding:20px;
    border-radius:15px;
    text-align:center;
}

.song-card h2{
    margin-bottom:10px;
}

.song-card button{
    background:#1db954;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

.player{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:#000;
    padding:15px;
    text-align:center;
}

audio{
    width:90%;
    max-width:500px;
}
</style>
</head>
<body>

<header>
<h1>🎵 Duman Music</h1>
</header>

<div class="song-card">
<h2>Semicenk - Çıkmaz Bir Sokakta</h2>
<p>Yüklediğin şarkı</p>

<button onclick="playSong()">
▶ Oynat
</button>
</div>

<div class="player">
<div id="nowPlaying">
Henüz şarkı seçilmedi
</div>

<audio id="audioPlayer" controls>
<source id="audioSource"
src="sarkilar/Semicenk - Çıkmaz Bir Sokakta(_cLygvXtukI_).m4a">
</audio>
</div>

<script>
function playSong(){
    const player=document.getElementById("audioPlayer");

    player.load();
    player.play();

    document.getElementById("nowPlaying").innerHTML=
    "🎵 Çalıyor: Semicenk - Çıkmaz Bir Sokakta";
}
</script>

</body>
</html>
