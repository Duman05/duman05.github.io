<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duman Music</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:white}
header{padding:20px;background:#181818;text-align:center}
header h1{color:#1db954}
.search{padding:20px;text-align:center}
.search input{width:90%;max-width:500px;padding:13px;border-radius:25px;border:none}
.container{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px}
.card{background:#1c1c1c;padding:15px;border-radius:15px;text-align:center;transition:.3s}
.card:hover{background:#292929;transform:scale(1.03)}
.cover{height:150px;border-radius:12px;background:linear-gradient(135deg,#1db954,#191414);display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:12px}
.card h3{margin-bottom:6px}
.card p{color:#aaa;margin-bottom:12px}
button{background:#1db954;color:white;border:none;padding:10px 18px;border-radius:20px;cursor:pointer;font-weight:bold}
footer{text-align:center;padding:20px;color:#777}
.player{position:fixed;bottom:0;left:0;right:0;background:#181818;padding:15px;text-align:center;border-top:1px solid #333}
</style>
</head>
<body>

<header>
  <h1>🎵 Duman Music</h1>
  <p>Demo şarkı dinleme sitesi</p>
</header>

<div class="search">
  <input type="text" id="searchInput" placeholder="Şarkı ara..." onkeyup="searchSongs()">
</div>

<div class="container" id="songList">

  <div class="card" data-name="Gece Yolcuları">
    <div class="cover">🎧</div>
    <h3>Gece Yolcuları</h3>
    <p>Duman</p>
    <button onclick="playSong('Gece Yolcuları')">Oynat</button>
  </div>

  <div class="card" data-name="Kalbim">
    <div class="cover">🎸</div>
    <h3>Kalbim</h3>
    <p>Demo Artist</p>
    <button onclick="playSong('Kalbim')">Oynat</button>
  </div>

  <div class="card" data-name="Hayal">
    <div class="cover">🔥</div>
    <h3>Hayal</h3>
    <p>Music Demo</p>
    <button onclick="playSong('Hayal')">Oynat</button>
  </div>

  <div class="card" data-name="Sessiz Gece">
    <div class="cover">🌙</div>
    <h3>Sessiz Gece</h3>
    <p>Lo-Fi</p>
    <button onclick="playSong('Sessiz Gece')">Oynat</button>
  </div>

</div>

<div class="player" id="player">
  Henüz şarkı seçilmedi
</div>

<footer>
  © 2026 Duman Music - Eğitim amaçlı demo sitedir
</footer>

<script>
function playSong(songName){
  document.getElementById("player").innerHTML = "▶ Şu an çalıyor: " + songName;
}

function searchSongs(){
  let input = document.getElementById("searchInput").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let name = card.getAttribute("data-name").toLowerCase();
    card.style.display = name.includes(input) ? "block" : "none";
  });
}
</script>

</body>
</html>
