<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Daralan Arena</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; background:#111; }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let arenaMargin = 0;
let shrinkSpeed = 0.1;

let player = {
  x: canvas.width/2,
  y: canvas.height/2,
  r: 15,
  speed: 4
};

let bots = [];

function spawnBots(){
  for(let i=0;i<5;i++){
    bots.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      r: 15,
      dx: (Math.random()-0.5)*3,
      dy: (Math.random()-0.5)*3
    });
  }
}
spawnBots();

let touchX = 0;
let touchY = 0;

canvas.addEventListener("touchmove", e=>{
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
});

function update(){

  // Arena daralıyor
  arenaMargin += shrinkSpeed;

  let left = arenaMargin;
  let right = canvas.width - arenaMargin;
  let top = arenaMargin;
  let bottom = canvas.height - arenaMargin;

  // Player hareket
  let dx = touchX - player.x;
  let dy = touchY - player.y;
  let dist = Math.sqrt(dx*dx+dy*dy);

  if(dist>5){
    player.x += dx/dist * player.speed;
    player.y += dy/dist * player.speed;
  }

  // Bot hareket
  bots.forEach(bot=>{
    bot.x += bot.dx;
    bot.y += bot.dy;

    if(bot.x < left+bot.r || bot.x > right-bot.r) bot.dx *= -1;
    if(bot.y < top+bot.r || bot.y > bottom-bot.r) bot.dy *= -1;
  });

  // Çarpışma kontrol (duvar)
  if(
    player.x < left+player.r ||
    player.x > right-player.r ||
    player.y < top+player.r ||
    player.y > bottom-player.r
  ){
    alert("Kaybettin!");
    location.reload();
  }
}

function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let left = arenaMargin;
  let right = canvas.width - arenaMargin;
  let top = arenaMargin;
  let bottom = canvas.height - arenaMargin;

  // Arena çiz
  ctx.strokeStyle="white";
  ctx.lineWidth=5;
  ctx.strokeRect(left, top, right-left, bottom-top);

  // Player
  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
  ctx.fill();

  // Bots
  ctx.fillStyle="red";
  bots.forEach(bot=>{
    ctx.beginPath();
    ctx.arc(bot.x, bot.y, bot.r, 0, Math.PI*2);
    ctx.fill();
  });

  update();
  requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
